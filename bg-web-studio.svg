<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#080810"/>
      <stop offset="45%" stop-color="#0c0c18"/>
      <stop offset="100%" stop-color="#100e22"/>
    </linearGradient>
    <linearGradient id="glow1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2"/>
    </linearGradient>
    <linearGradient id="glow2" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow3" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#12121f"/>
    </linearGradient>
    <radialGradient id="orb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#6366f1" stroke-opacity="0.07" stroke-width="0.5"/>
    </pattern>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="10" cy="10" r="0.5" fill="#818cf8" opacity="0.15"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="50"/></filter>
    <filter id="blurSm"><feGaussianBlur stdDeviation="20"/></filter>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#grid)"/>
  <rect width="1920" height="1080" fill="url(#dots)"/>

  <ellipse cx="960" cy="380" rx="750" ry="420" fill="url(#glow1)" filter="url(#blur)" opacity="0.75"/>
  <ellipse cx="280" cy="780" rx="450" ry="320" fill="url(#glow2)" filter="url(#blur)" opacity="0.55"/>
  <ellipse cx="1580" cy="620" rx="380" ry="280" fill="url(#glow3)" filter="url(#blur)" opacity="0.45"/>
  <circle cx="960" cy="540" r="180" fill="url(#orb)" filter="url(#blurSm)" opacity="0.5"/>

  <!-- Stars -->
  <g opacity="0.4">
    <circle cx="200" cy="120" r="1.5" fill="#fff"/>
    <circle cx="450" cy="80" r="1" fill="#818cf8"/>
    <circle cx="780" cy="150" r="1.2" fill="#fff"/>
    <circle cx="1100" cy="90" r="1" fill="#a855f7"/>
    <circle cx="1450" cy="130" r="1.5" fill="#fff"/>
    <circle cx="1700" cy="70" r="1" fill="#818cf8"/>
    <circle cx="350" cy="950" r="1" fill="#fff"/>
    <circle cx="820" cy="980" r="1.2" fill="#6366f1"/>
    <circle cx="1280" cy="920" r="1" fill="#fff"/>
    <circle cx="1650" cy="960" r="1.5" fill="#a855f7"/>
  </g>

  <!-- Browser 1 -->
  <g opacity="0.6" transform="translate(100,160) rotate(-10)">
    <rect width="440" height="290" rx="14" fill="#14141f" stroke="#6366f1" stroke-opacity="0.35" stroke-width="1.2"/>
    <rect width="440" height="38" rx="14" fill="#1c1c28"/>
    <circle cx="22" cy="19" r="5.5" fill="#ff5f57"/>
    <circle cx="44" cy="19" r="5.5" fill="#febc2e"/>
    <circle cx="66" cy="19" r="5.5" fill="#28c840"/>
    <rect x="88" y="11" width="220" height="16" rx="5" fill="#0a0a12" opacity="0.7"/>
    <rect x="18" y="54" width="404" height="80" rx="8" fill="url(#glow1)" opacity="0.35"/>
    <rect x="18" y="150" width="200" height="10" rx="3" fill="#6366f1" opacity="0.55"/>
    <rect x="18" y="170" width="300" height="7" rx="2" fill="#fff" opacity="0.18"/>
    <rect x="18" y="186" width="260" height="7" rx="2" fill="#fff" opacity="0.1"/>
    <rect x="18" y="220" width="130" height="36" rx="8" fill="#6366f1" opacity="0.65"/>
    <rect x="160" y="220" width="100" height="36" rx="8" fill="none" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1"/>
  </g>

  <!-- Browser 2 -->
  <g opacity="0.5" transform="translate(1360,100) rotate(8)">
    <rect width="400" height="270" rx="14" fill="#14141f" stroke="#a855f7" stroke-opacity="0.3" stroke-width="1"/>
    <rect width="400" height="34" rx="14" fill="#1c1c28"/>
    <circle cx="20" cy="17" r="5" fill="#ff5f57"/>
    <circle cx="38" cy="17" r="5" fill="#febc2e"/>
    <circle cx="56" cy="17" r="5" fill="#28c840"/>
    <rect x="18" y="50" width="364" height="190" rx="8" fill="url(#screen)"/>
    <rect x="34" y="66" width="220" height="14" rx="3" fill="#a855f7" opacity="0.45"/>
    <rect x="34" y="92" width="170" height="8" rx="2" fill="#fff" opacity="0.14"/>
    <rect x="34" y="130" width="110" height="32" rx="8" fill="#6366f1" opacity="0.55"/>
    <rect x="34" y="180" width="150" height="40" rx="6" fill="#6366f1" opacity="0.15"/>
    <rect x="200" y="180" width="150" height="40" rx="6" fill="#a855f7" opacity="0.12"/>
  </g>

  <!-- Browser 3 -->
  <g opacity="0.4" transform="translate(650,660) rotate(-4)">
    <rect width="380" height="250" rx="12" fill="#14141f" stroke="#818cf8" stroke-opacity="0.25" stroke-width="1"/>
    <rect width="380" height="32" rx="12" fill="#1c1c28"/>
    <rect x="18" y="46" width="344" height="170" rx="6" fill="#0f0f18"/>
    <rect x="30" y="58" width="90" height="90" rx="6" fill="#6366f1" opacity="0.22"/>
    <rect x="130" y="58" width="210" height="12" rx="3" fill="#fff" opacity="0.16"/>
    <rect x="130" y="80" width="170" height="8" rx="2" fill="#fff" opacity="0.09"/>
    <rect x="130" y="110" width="90" height="28" rx="6" fill="#a855f7" opacity="0.4"/>
  </g>

  <!-- Browser 4 small -->
  <g opacity="0.3" transform="translate(1480,720) rotate(5)">
    <rect width="300" height="200" rx="10" fill="#14141f" stroke="#6366f1" stroke-opacity="0.2" stroke-width="1"/>
    <rect width="300" height="28" rx="10" fill="#1c1c28"/>
    <rect x="14" y="40" width="272" height="130" rx="5" fill="#0f0f18"/>
    <rect x="26" y="52" width="120" height="10" rx="2" fill="#818cf8" opacity="0.35"/>
    <rect x="26" y="72" width="200" height="6" rx="2" fill="#fff" opacity="0.1"/>
  </g>

  <!-- Code symbols -->
  <text x="1550" y="880" font-family="monospace" font-size="130" fill="#6366f1" opacity="0.09">&lt;/&gt;</text>
  <text x="180" y="920" font-family="monospace" font-size="90" fill="#a855f7" opacity="0.07">{ }</text>
  <text x="860" y="180" font-family="monospace" font-size="64" fill="#818cf8" opacity="0.08">HTML</text>
  <text x="1020" y="820" font-family="monospace" font-size="52" fill="#6366f1" opacity="0.07">CSS</text>
  <text x="120" y="380" font-family="monospace" font-size="48" fill="#a855f7" opacity="0.06">JS</text>
  <text x="1750" y="400" font-family="monospace" font-size="36" fill="#818cf8" opacity="0.06">React</text>

  <!-- Connection network -->
  <path d="M 520 300 Q 960 180 1380 260" fill="none" stroke="#6366f1" stroke-opacity="0.1" stroke-width="1.2" stroke-dasharray="10 8"/>
  <path d="M 280 480 Q 960 580 1620 480" fill="none" stroke="#a855f7" stroke-opacity="0.08" stroke-width="1" stroke-dasharray="8 10"/>
  <path d="M 960 540 L 650 660" fill="none" stroke="#818cf8" stroke-opacity="0.06" stroke-width="1" stroke-dasharray="6 8"/>
  <path d="M 960 540 L 1360 100" fill="none" stroke="#6366f1" stroke-opacity="0.06" stroke-width="1" stroke-dasharray="6 8"/>

  <!-- Hex decoration -->
  <polygon points="960,480 980,491 980,513 960,524 940,513 940,491" fill="none" stroke="#6366f1" stroke-opacity="0.12" stroke-width="1"/>
  <polygon points="960,480 970,486 970,498 960,504 950,498 950,486" fill="#6366f1" opacity="0.05"/>
</svg>
